name: CI

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo check -p axi-dma --features portable-atomic
      - run: cargo check -p axi-uart16550 --features portable-atomic
      - run: cargo check -p axi-uartlite --features portable-atomic
      - run: cargo check -p axi-dma --features defmt
      - run: cargo check -p axi-ad9361 --features defmt
      - run: cargo check -p axi-uart16550 --features defmt
      - run: cargo check -p axi-uartlite --features defmt

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: |
          RUSTDOCFLAGS="--cfg docsrs -Z unstable-options --generate-link-to-definition" \
            cargo doc --workspace --no-deps

  cross-check:
    name: cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf, armv7a-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --target armv7-unknown-linux-gnueabihf
      - run: cargo build --workspace --target armv7a-none-eabihf
